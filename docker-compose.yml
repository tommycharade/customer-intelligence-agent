name: customer-intelligence
x-health: &health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s
x-service: &service
  restart: unless-stopped
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 768m
  healthcheck: *health
  networks: [research]
services:
  init:
    image: python:3.12.12-slim-bookworm
    command: ["python", "/init.py"]
    restart: "no"
    network_mode: none
    volumes:
      - ./services/init_secrets.py:/init.py:ro
      - ./services/searxng/settings.yml:/settings-template.yml:ro
      - gateway-auth:/secrets/gateway
      - search-auth:/secrets/search
      - crawl-auth:/secrets/crawl
      - searx-config:/searx-config
      - app-data:/volumes/app
      - gateway-data:/volumes/gateway
      - crawler-data:/volumes/crawler
  searxng:
    image: docker.io/searxng/searxng@sha256:55e1fa15a63ff04e79e213e6aa2837549877b0c6d60757cdb633ae9111cb5fea
    restart: unless-stopped
    depends_on:
      init: {condition: service_completed_successfully}
    volumes: ["searx-config:/etc/searxng:ro"]
    networks: [research]
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  search-mcp:
    <<: *service
    build: {context: ., target: services}
    command: ["python", "-m", "customer_intelligence.research_stack.server", "search"]
    depends_on:
      searxng: {condition: service_healthy}
    environment:
      SEARCH_MCP_TOKEN_FILE: /run/auth/token
      SEARXNG_URL: http://searxng:8080
    volumes: ["search-auth:/run/auth:ro"]
  crawl-mcp:
    <<: *service
    build: {context: ., target: crawler}
    command: ["python", "-m", "customer_intelligence.research_stack.server", "crawl"]
    depends_on:
      init: {condition: service_completed_successfully}
    mem_limit: 2g
    shm_size: 256m
    environment:
      CRAWL_MCP_TOKEN_FILE: /run/auth/token
      CRAWL4_AI_BASE_DIRECTORY: /data
    volumes: ["crawl-auth:/run/auth:ro", "crawler-data:/data"]
  gateway:
    <<: *service
    build: {context: ., target: services}
    command: ["python", "-m", "customer_intelligence.research_stack.server", "gateway"]
    depends_on:
      search-mcp: {condition: service_healthy}
      crawl-mcp: {condition: service_healthy}
    ports: ["127.0.0.1:${RESEARCH_GATEWAY_PORT:-8767}:8000"]
    environment:
      GATEWAY_MCP_TOKEN_FILE: /run/client-auth/token
      SEARCH_MCP_TOKEN_FILE: /run/search-auth/token
      CRAWL_MCP_TOKEN_FILE: /run/crawl-auth/token
      RESEARCH_DATA_DIR: /data
      SEARCH_CACHE_TTL: ${SEARCH_CACHE_TTL:-900}
      PAGE_CACHE_TTL: ${PAGE_CACHE_TTL:-21600}
    volumes: ["gateway-auth:/run/client-auth:ro", "search-auth:/run/search-auth:ro", "crawl-auth:/run/crawl-auth:ro", "gateway-data:/data"]
  intelligence:
    <<: *service
    build: {context: ., target: application}
    depends_on:
      gateway: {condition: service_healthy}
    ports: ["127.0.0.1:${CIA_DOCKER_PORT:-8766}:8765"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RESEARCH_GATEWAY_URL: http://gateway:8000/mcp
      GATEWAY_MCP_TOKEN_FILE: /run/auth/token
    volumes: ["gateway-auth:/run/auth:ro", "app-data:/data"]
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
networks:
  research:
volumes:
  gateway-auth:
  search-auth:
  crawl-auth:
  searx-config:
  app-data:
  gateway-data:
  crawler-data:
