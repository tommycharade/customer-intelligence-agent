name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete Git history with Gitleaks 8.30.1
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts=--all --redact --no-banner
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.5"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked --extra crawl --python 3.12
      - run: uv run ruff check .
      - run: uv run playwright install --with-deps chromium
      - run: uv run --extra crawl pytest
      - run: npm --prefix web ci
      - run: npm --prefix web run check
      - run: npm --prefix web run build
      - run: uv run python scripts/browser_check.py
      - run: docker compose config --quiet
